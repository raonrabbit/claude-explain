<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
<style>
  :root {
    --bg: #ffffff; --fg: #1f2328; --muted: #656d76; --line: #d1d9e0;
    --accent: #0969da; --sidebar: #f6f8fa; --code-bg: #f6f8fa;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117; --fg: #e6edf3; --muted: #8b949e; --line: #30363d;
      --accent: #4493f8; --sidebar: #161b22; --code-bg: #161b22;
    }
  }
  * { box-sizing: border-box; }
  html {
    scroll-behavior: smooth;
    /* iOS가 회전/좁은폭에서 글자 크기를 임의 보정하지 않게 고정하는 위생용 설정.
       ※ '글씨 작음'의 진짜 원인은 아래의 가로 오버플로우다 —
       화면보다 넓은 요소(표/코드/grid main)가 있으면 폰이 페이지 전체를 축소해 맞추면서
       글씨까지 작아진다. 그 오버플로우를 없애는 게(min-width:0 · 표 래핑 · 토큰 줄바꿈) 본 처방. */
    -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
  }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font-family: -apple-system, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    font-size: 16px; line-height: 1.75;
    display: grid; grid-template-columns: 280px 1fr;
  }
  nav {
    position: sticky; top: 0; align-self: start; height: 100vh; overflow-y: auto;
    background: var(--sidebar); border-right: 1px solid var(--line); padding: 24px 16px;
  }
  nav .book-title { font-weight: 700; font-size: 15px; margin-bottom: 16px; }
  nav a {
    display: block; color: var(--muted); text-decoration: none;
    padding: 4px 8px; border-radius: 6px; font-size: 14px; line-height: 1.5;
    transition: color .15s ease, background .15s ease;
  }
  nav a:hover { background: var(--line); color: var(--fg); }
  nav a.h3 { padding-left: 22px; font-size: 13px; }
  nav a.active {
    color: var(--accent); font-weight: 600;
    background: color-mix(in srgb, var(--accent) 12%, transparent);
  }
  main {
    padding: 48px 56px; max-width: 820px; margin: 0 auto; width: 100%;
    /* grid 자식은 기본 min-width:auto 라, 넓은 코드/표가 트랙을 늘려 페이지가 가로로 삐져나온다.
       min-width:0 을 줘야 자식이 자기 박스 안에서 스크롤되고 페이지는 화면 너비를 넘지 않는다. */
    min-width: 0; overflow-wrap: break-word;
  }
  h1 { font-size: 2em; padding-bottom: .3em; border-bottom: 1px solid var(--line); }
  h2 { font-size: 1.5em; margin-top: 2em; padding-bottom: .3em; border-bottom: 1px solid var(--line); scroll-margin-top: 24px; }
  h3 { font-size: 1.2em; margin-top: 1.6em; scroll-margin-top: 24px; }
  a { color: var(--accent); }
  code {
    background: var(--code-bg); padding: .2em .4em; border-radius: 6px;
    font-family: "SFMono-Regular", Consolas, monospace; font-size: 85%;
    /* 긴 URL·식별자 같은 끊기지 않는 문자열이 인라인 코드로 오면 페이지를 넓히므로 강제로 끊는다 */
    overflow-wrap: anywhere;
  }
  pre { background: var(--code-bg); padding: 16px; border-radius: 8px; overflow: auto; }
  pre code { background: none; padding: 0; font-size: 90%; overflow-wrap: normal; }
  blockquote {
    margin: 0; padding: 0 1em; color: var(--muted); border-left: .25em solid var(--line);
  }
  /* 넓은 표는 페이지를 밀어내지 않도록 스크롤 박스로 감싼다(JS가 각 table을 .table-wrap 로 래핑) */
  .table-wrap { overflow-x: auto; max-width: 100%; margin: 0 0 16px; -webkit-overflow-scrolling: touch; }
  table { border-collapse: collapse; }
  th, td { border: 1px solid var(--line); padding: 6px 13px; overflow-wrap: anywhere; }
  a { overflow-wrap: anywhere; }
  img { max-width: 100%; }
  /* 사이드바: 전체 목차(index)로 돌아가는 홈 링크 (챕터형에서 사용) */
  nav .home-link { color: var(--accent); font-weight: 600; margin-bottom: 16px; }
  /* 챕터 하단 이전/목차/다음 네비게이션 (hover 효과 포함) */
  .chapter-nav {
    display: flex; gap: 8px; align-items: stretch;
    margin-top: 48px; padding-top: 24px; border-top: 1px solid var(--line);
  }
  .chapter-nav a, .chapter-nav span {
    flex: 1; min-width: 0; padding: 12px 14px; border: 1px solid var(--line);
    border-radius: 8px; font-size: 14px; line-height: 1.4;
    text-decoration: none; color: var(--fg);
    transition: border-color .15s ease, background .15s ease, transform .15s ease;
  }
  .chapter-nav a:hover { border-color: var(--accent); background: var(--sidebar); transform: translateY(-2px); }
  .chapter-nav .nav-home { flex: 0 0 auto; display: flex; align-items: center; white-space: nowrap; color: var(--accent); font-weight: 600; }
  .chapter-nav .nav-next { text-align: right; }
  .chapter-nav .disabled { opacity: .45; }
  /* 참고 자료 출처 태그 (새 탭으로 열리는 외부 링크, hover 효과 포함) */
  .source-tag {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 2px 10px; margin: 2px 6px 2px 0;
    border: 1px solid var(--line); border-radius: 999px;
    font-size: 13px; text-decoration: none; color: var(--accent);
    transition: border-color .15s ease, background .15s ease;
  }
  .source-tag:hover { border-color: var(--accent); background: var(--sidebar); }
  .source-tag::after { content: "↗"; font-size: 11px; opacity: .7; }
  /* 본문 안 인라인 인용: 개념어 자체를 출처로 연결하는 파란 링크 (밑줄 + ↗) */
  .cite-link { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
  .cite-link::after { content: "↗"; font-size: .72em; vertical-align: super; margin-left: 1px; opacity: .7; }
  /* 본문 안 인라인 인용: 문장 끝에 붙이는 작은 ↗ 아이콘 마커 (새 탭) */
  a.cite {
    display: inline-block; margin-left: 3px; padding: 0 4px;
    font-size: .72em; line-height: 1.3; vertical-align: super;
    color: var(--accent); text-decoration: none;
    border: 1px solid var(--line); border-radius: 4px;
    transition: border-color .15s ease, background .15s ease;
  }
  a.cite:hover { border-color: var(--accent); background: var(--sidebar); }
  @media (max-width: 720px) {
    /* 사이드바를 위로 접고, 본문은 화면 폭을 꽉 쓰되 좌우 여백을 줄여 읽기 좋게 */
    body { grid-template-columns: 1fr; font-size: 17px; }
    nav { position: static; height: auto; max-height: 42vh; border-right: none; border-bottom: 1px solid var(--line); }
    main { padding: 24px 18px; }
    h1 { font-size: 1.6em; }
    h2 { font-size: 1.32em; }
    h3 { font-size: 1.14em; }
    pre { padding: 12px; }
    .chapter-nav { flex-wrap: wrap; }
  }
  /* PDF(인쇄) 출력: 사이드바·네비를 숨기고 문서처럼 한 폭으로 편다 */
  @page { margin: 16mm 14mm; }
  @media print {
    body { display: block; font-size: 12pt; }
    nav, .chapter-nav, .home-link { display: none; }
    main { max-width: none; margin: 0; padding: 0; }
    a { color: inherit; text-decoration: none; }
    .cite-link, a.cite, .source-tag { color: inherit; border: none; }
    /* 화면에선 스크롤되던 코드/표가 인쇄에선 잘리므로, 줄바꿈해서 종이 안에 다 담는다 */
    pre { white-space: pre-wrap; word-wrap: break-word; overflow: visible; }
    pre, blockquote, .table-wrap, table, img { break-inside: avoid; page-break-inside: avoid; }
    h1, h2, h3 { break-after: avoid; page-break-after: avoid; }
  }
</style>
</head>
<body>
<nav>
  <div class="book-title">{{TITLE}}</div>
  <!-- 챕터형 가이드북: 전체 목차(index)로 돌아가는 상시 링크. 단일 파일이면 이 줄을 지운다. -->
  <a class="home-link" href="index.html">📚 전체 목차로</a>
  <div id="toc"></div>
</nav>
<main id="content-rendered"></main>

<!-- 본문을 여기에 마크다운으로 작성한다. 목차는 h2/h3에서 자동 생성된다. -->
<script id="content" type="text/markdown">
# {{TITLE}}

여기에 가이드북 본문을 마크다운으로 작성한다.

<!-- 출처는 두 층으로 단다.
(1) 인라인 인용 — 주장/개념/수치가 나오는 바로 그 자리에 건다. 두 방식 중 택:
  · 개념어 자체를 링크: <a class="cite-link" href="URL" target="_blank" rel="noopener noreferrer">Route Handlers</a>
  · 문장 끝 아이콘 마커: 5분 rolling window로 집계한다<a class="cite" href="URL" target="_blank" rel="noopener noreferrer" title="출처: 공식문서">↗</a>
(2) 하단 종합 — 챕터 끝에 참고 자료 섹션. 예:
## 참고 자료
<a class="source-tag" href="https://docs.example.com/page.html" target="_blank" rel="noopener noreferrer">문서 제목</a>
-->

<!-- 챕터형이면 본문 맨 끝(아래 </script> 직전)에 이전/목차/다음 네비를 넣는다. 예:
<div class="chapter-nav">
  <a class="nav-prev" href="01-....html">← 이전<br><strong>01. 이전 장 제목</strong></a>
  <a class="nav-home" href="index.html">📚 목차</a>
  <a class="nav-next" href="03-....html">다음 →<br><strong>03. 다음 장 제목</strong></a>
</div>
첫 장의 이전·마지막 장의 다음은 <span class="disabled">← 이전 없음</span> 처럼 span 으로 비활성 처리한다. -->
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.0/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script>
  const md = document.getElementById('content').textContent;
  const main = document.getElementById('content-rendered');
  main.innerHTML = marked.parse(md);
  document.querySelectorAll('pre code').forEach(el => window.hljs && hljs.highlightElement(el));

  // 넓은 표가 페이지를 가로로 밀어내지 않도록, 각 표를 가로 스크롤 박스로 감싼다
  main.querySelectorAll('table').forEach(t => {
    if (t.parentElement.classList.contains('table-wrap')) return;
    const wrap = document.createElement('div');
    wrap.className = 'table-wrap';
    t.replaceWith(wrap);
    wrap.appendChild(t);
  });

  // 목차 자동 생성 (h2/h3)
  const toc = document.getElementById('toc');
  const heads = main.querySelectorAll('h2, h3');
  heads.forEach((h, i) => {
    const id = 'sec-' + i;
    h.id = id;
    const a = document.createElement('a');
    a.href = '#' + id;
    a.textContent = h.textContent;
    a.className = h.tagName === 'H3' ? 'h3' : 'h2';
    toc.appendChild(a);
  });

  // ── 부드러운 스크롤 이동 + 목차 하이라이트(스크롤스파이) ──────────────
  const links = [...toc.querySelectorAll('a')];
  const headList = [...heads];
  const navEl = document.querySelector('nav');
  const prefersReduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const LINE = 120; // 뷰포트 상단에서 이 지점을 마지막으로 지난 제목을 '지금 읽는 섹션'으로 본다

  let lock = false;      // 목차 클릭으로 스크롤하는 동안 스크롤스파이를 잠근다
  let lockTimer = null;

  // 활성 목차 항목이 사이드바 밖으로 벗어나면, 나브 스크롤만 살짝 조정한다(윈도우는 안 건드림)
  function keepVisible(link) {
    const lr = link.getBoundingClientRect(), nr = navEl.getBoundingClientRect();
    if (lr.top < nr.top + 8) navEl.scrollTop -= nr.top + 8 - lr.top;
    else if (lr.bottom > nr.bottom - 8) navEl.scrollTop += lr.bottom - (nr.bottom - 8);
  }

  function activate(link, scrollNav) {
    if (!link || link.classList.contains('active')) return;
    links.forEach(l => l.classList.remove('active'));
    link.classList.add('active');
    if (scrollNav) keepVisible(link);
  }

  const linkFor = id => links.find(l => l.getAttribute('href') === '#' + id);

  // 지금 화면에서 '읽고 있는' 제목을 계산한다 — 얇은 감지 밴드가 아니라 위치 기준이라 안 끊긴다
  function currentHead() {
    if (innerHeight + scrollY >= document.body.scrollHeight - 2) {
      return headList[headList.length - 1]; // 페이지 맨 아래면 마지막 섹션을 활성화
    }
    let cur = headList[0];
    for (const h of headList) {
      if (h.getBoundingClientRect().top - LINE <= 0) cur = h;
      else break;
    }
    return cur;
  }

  let ticking = false;
  function onScroll() {
    if (lock || ticking) return;
    ticking = true;
    requestAnimationFrame(() => {
      ticking = false;
      const h = currentHead();
      if (h) activate(linkFor(h.id), true);
    });
  }

  // 목차 클릭: 기본 점프를 막고 부드럽게 이동 + 즉시 하이라이트(스크롤을 기다리지 않는다)
  links.forEach(link => {
    link.addEventListener('click', e => {
      e.preventDefault();
      const id = link.getAttribute('href').slice(1);
      const target = document.getElementById(id);
      if (!target) return;
      activate(link, false);      // 클릭 순간 바로 활성화 → 지연·깜빡임 없음
      lock = true;                // 이동하는 동안 중간 제목들이 훑고 지나가지 않게 잠금
      clearTimeout(lockTimer);
      target.scrollIntoView({ behavior: prefersReduced ? 'auto' : 'smooth', block: 'start' });
      history.replaceState(null, '', '#' + id);
      lockTimer = setTimeout(() => { lock = false; }, 700); // scrollend 미지원 브라우저용 안전장치
    });
  });

  addEventListener('scroll', onScroll, { passive: true });
  addEventListener('scrollend', () => { lock = false; }, { passive: true }); // 지원 시 이동 끝나면 즉시 잠금 해제
  if (headList.length) onScroll(); // 초기 진입/해시 이동 시 현재 섹션 활성화
</script>
</body>
</html>
